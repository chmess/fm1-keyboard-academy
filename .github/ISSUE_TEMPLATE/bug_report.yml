name: Bug report
description: Report a reproducible Keyboard Academy problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: firmware
    attributes:
      label: Firmware identity
      description: The FM-1 identity shown by the updater, for example FM-1_8241002.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Test environment
      options: [Physical FM-1, Browser simulator, Host unit test]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not disconnect power or USB during an update.
