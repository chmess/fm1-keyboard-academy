<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard Academy course map</title>
  <desc id="desc">Eight connected beginner keyboard course chapters.</desc>
  <rect width="1200" height="360" rx="24" fill="#0b1118"/>
  <text x="42" y="54" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#eff7f5">FROM FIRST KEY TO FIRST SONG</text>
  <path d="M110 140 H1090 M1090 140 V270 H110" fill="none" stroke="#294153" stroke-width="8" stroke-linecap="round"/>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <g transform="translate(110 140)"><circle r="42" fill="#1b6f78"/><text y="8" font-size="24" fill="white">1</text><text y="72" font-size="15" fill="#dce7e5">FIND KEYS</text></g>
    <g transform="translate(390 140)"><circle r="42" fill="#276c91"/><text y="8" font-size="24" fill="white">2</text><text y="72" font-size="15" fill="#dce7e5">FIVE FINGERS</text></g>
    <g transform="translate(670 140)"><circle r="42" fill="#575da5"/><text y="8" font-size="24" fill="white">3</text><text y="72" font-size="15" fill="#dce7e5">RHYTHM</text></g>
    <g transform="translate(950 140)"><circle r="42" fill="#8a559c"/><text y="8" font-size="24" fill="white">4</text><text y="72" font-size="15" fill="#dce7e5">STEPS + SKIPS</text></g>
    <g transform="translate(950 270)"><circle r="42" fill="#a64e79"/><text y="8" font-size="24" fill="white">5</text><text y="72" font-size="15" fill="#dce7e5">EASY SONGS</text></g>
    <g transform="translate(670 270)"><circle r="42" fill="#a9634d"/><text y="8" font-size="24" fill="white">6</text><text y="72" font-size="15" fill="#dce7e5">FOLK SONGS</text></g>
    <g transform="translate(390 270)"><circle r="42" fill="#8b793f"/><text y="8" font-size="24" fill="white">7</text><text y="72" font-size="15" fill="#dce7e5">CLASSICS</text></g>
    <g transform="translate(110 270)"><circle r="42" fill="#38794d"/><text y="8" font-size="24" fill="white">8</text><text y="72" font-size="15" fill="#dce7e5">CHALLENGE</text></g>
  </g>
</svg>
